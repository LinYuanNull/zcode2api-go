name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 跟随 go.mod 的 go 指令（当前 1.26.0），避免 CI 版本与模块要求漂移。
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未通过 gofmt（请运行 gofmt -w）："
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      # 契约文档的骨架键序必须与 docs/contract/admin/*.json 样本一致：
      # 骨架是照写 struct 字段声明序的输入，顺序错了响应体就与靶机不同形。
      - name: contract spec key order
        run: python3 tools/spec_reorder.py --check
